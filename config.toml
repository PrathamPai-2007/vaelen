# Delta Exchange Trading Engine Configuration
# All strategy parameters are configurable here without recompilation

[general]
# REST API endpoint
api_base_url = "https://api.india.delta.exchange"
# Paper trading mode (true = paper, false = live)
paper_trade_mode = true
# Maximum concurrent positions across all symbols
max_concurrent_positions = 5
# Channel buffer size for trade events
trade_channel_buffer = 1000
# Session CSV output directory
trades_dir = "trades"
# Log level: trace, debug, info, warn, error
log_level = "info"
# Enable JSON structured logging
json_logs = false
# Log to file (in addition to stdout)
log_file = "logs/engine.log"

[websocket]
# WebSocket endpoint
ws_url = "wss://public-socket.india.delta.exchange"
# Subscription payload
symbols = ["1000PEPEUSD"]
# Ping interval in seconds (0 = disabled, rely on server pings)
ping_interval_secs = 0
# Watchdog timeout in seconds - reconnect if no messages received
watchdog_timeout_secs = 30
# Reconnection exponential backoff base (seconds)
reconnect_base_secs = 1
# Maximum reconnection backoff (seconds)
reconnect_max_secs = 60
# User agent string
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

[order_manager]
# Order request timeout (seconds)
request_timeout_secs = 10
# Max retry attempts for failed orders
max_retries = 5
# Base retry delay (seconds) - exponential backoff: base * 2^attempt
retry_base_delay_secs = 1
# Maximum retry delay (seconds)
retry_max_delay_secs = 60
# Retry on these HTTP status codes (comma-separated)
retry_on_status = [429, 500, 502, 503, 504]
# Enable order fill confirmation tracking
track_fills = true
# Fill confirmation timeout (seconds)
fill_timeout_secs = 30

[fees]
# Taker fee rate (market orders)
taker_fee_rate = 0.0005
# Maker fee rate (limit orders)
maker_fee_rate = 0.0002
# Slippage in basis points (1 bp = 0.01%) - applied per trade
slippage_bps = 5.0

[strategy]
# Per-symbol configurations (Top MACD Momentum & Order Flow Performers)
symbols = [
  # SOLUSD: Solana Perpetual (#1 Performer: 59.5% Win Rate, 1.92 Profit Factor)
  { symbol = "SOLUSD", product_id = 9999, strategy_type = "macd_momentum", contract_size = 1.0, order_size = 10,
    tick_size = 0.01, norm_threshold_pct = 0.015, sl_atr_mult = 1.5, risk_reward_ratio = 1.5 },

  # ETHUSD: Ethereum Perpetual (#2 Performer: 58.1% Win Rate, 1.81 Profit Factor)
  { symbol = "ETHUSD", product_id = 8888, strategy_type = "macd_momentum", contract_size = 1.0, order_size = 1,
    tick_size = 0.05, norm_threshold_pct = 0.015, sl_atr_mult = 1.5, risk_reward_ratio = 1.5 },

  # BTCUSD: Bitcoin Perpetual (#3 Performer: 65.9% Win Rate, 2.18 Profit Factor)
  { symbol = "BTCUSD", product_id = 7777, strategy_type = "macd_momentum", contract_size = 0.05, order_size = 1,
    tick_size = 0.1, norm_threshold_pct = 0.015, sl_atr_mult = 1.5, risk_reward_ratio = 1.5 },

  # WIFUSD: dogwifhat Perpetual (#4 Performer: 55.4% Win Rate, 1.61 Profit Factor)
  { symbol = "WIFUSD", product_id = 6666, strategy_type = "macd_momentum", contract_size = 1.0, order_size = 50,
    tick_size = 0.0001, norm_threshold_pct = 0.015, sl_atr_mult = 1.5, risk_reward_ratio = 1.5 }
]

[session_tracking]
# Enable detailed session analytics
enabled = true
# Risk-free rate for Sharpe calculation (annualized, e.g., 0.05 = 5%)
risk_free_rate = 0.05
# Equity curve snapshot interval (ticks)
equity_snapshot_interval = 100
# Initial equity for PnL tracking (USD)
initial_equity = 10000.0
# Estimated ticks per trading day for annualization
ticks_per_day_estimate = 10000.0
# Estimated ticks per trading day for Sharpe annualization
estimated_ticks_per_day = 50000.0

[gold_arb]
enabled = true
api_host = "https://api.india.delta.exchange"
leg_long = "PAXGUSD"
leg_short = "XAUTUSD"
effective_leverage = 3.0
position_sizing_pct = 0.50
target_contracts = 9
max_depeg_stop_loss_bps = 300.0
paper_trading_initial_balance = 50.0
poll_interval_sec = 10
funding_interval_hours = 8

[macd_momentum]
# 5-minute Trend-Following MACD Momentum Strategy Configuration
enabled = true
# Fast EMA period for MACD line (default 12)
macd_fast = 12
# Slow EMA period for MACD line (default 26)
macd_slow = 26
# Signal EMA period for MACD signal line (default 9)
macd_signal = 9
# Trend Filter EMA period on 15m/1h timeframe (default 200)
ema_filter = 200
# MACD_% normalized threshold percentage: MACD_% = ((EMA_12 - EMA_26) / Price) * 100
# Trigger Long when MACD_% > +norm_threshold_pct and Short when MACD_% < -norm_threshold_pct
norm_threshold_pct = 0.015
# Hard Stop-Loss multiplier (ATR multiple)
sl_atr_mult = 1.5
# Target Risk-Reward ratio (e.g., 1.5 = 1:1.5 Risk-Reward)
risk_reward_ratio = 1.5
# ATR lookback period
atr_period = 14
# Main strategy candle interval (minutes)
candle_interval_mins = 1
# Trend filter candle interval (minutes)
trend_filter_interval_mins = 15
# Minimum ticks between entry signals
entry_cooldown_ticks = 100
# Execution Order Type: "limit" (Maker entry) or "market" (Taker entry)
order_type = "limit"
# Maximum position hold duration in minutes to qualify for Delta's 0% Scalper Offer closing fee
max_hold_mins = 15
# Enable Delta Exchange Scalper Offer 0% closing fee discount for trades <= 15 minutes
scalper_offer_enabled = true


